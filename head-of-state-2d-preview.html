const BASE_W = 2000, BASE_H = 1000;
const $ = id => document.getElementById(id);

let selected=null,k=1,fit=1,panX=0,panY=0,w=1,h=1;
const clamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
function clampPan(){
 if(k<=1.000001){panX=0;panY=0;return;}
 const fw=BASE_W*fit*k,fh=BASE_H*fit*k;
 const mx=Math.max(0,(fw-w)/2)+w*.23,my=Math.max(0,(fh-h)/2)+h*.23;
 panX=clamp(panX,-mx,mx);panY=clamp(panY,-my,my);
}
let previousRadius=-1;
function paint(){
 clampPan();
 const scale=fit*k;
 viewport.setAttribute('transform',`translate(${w/2+panX} ${h/2+panY}) scale(${scale}) translate(${-BASE_W/2} ${-BASE_H/2})`);
 if(previousRadius!==k){
   // Transparent helper targets only for extremely small countries; not drawn as selection markers.
   const radius=clamp(k<2?7:10,7,10)/Math.max(.001,scale);
   for(const n of circleNodes)n.setAttribute('r',radius.toFixed(3));
   previousRadius=k;
 }
 $('zoomBadge').textContent='×'+k.toFixed(k<10?1:0);
}
function resize(){
 const rect=svg.getBoundingClientRect(),oldFit=fit,oldW=w,oldH=h;
 const centerX=BASE_W/2-panX/Math.max(.001,oldFit*k),centerY=BASE_H/2-panY/Math.max(.001,oldFit*k);
 w=Math.max(1,rect.width);h=Math.max(1,rect.height);
 svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 fit=Math.max(.0001,Math.min((w-20)/BASE_W,(h-10)/BASE_H));
 if(oldW>1&&oldH>1&&k>1){panX=(BASE_W/2-centerX)*fit*k;panY=(BASE_H/2-centerY)*fit*k;}
 paint();
}
if('ResizeObserver' in window)new ResizeObserver(resize).observe(svg);
else addEventListener('resize',resize);
resize();
function pos(e){const b=svg.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};}
function zoomAt(target,x=w/2,y=h/2){
 const next=clamp(target,1,18),ratio=next/k;
 panX=(x-w/2)-((x-w/2)-panX)*ratio;
 panY=(y-h/2)-((y-h/2)-panY)*ratio;
 k=next;paint();
}
function reset(){k=1;panX=panY=0;paint();}
function focus(id){
 const a=ANCHORS[id];if(!a)return;
 k=['russia','united-states','canada'].includes(id)?3:5.5;
 panX=-(a[0]-BASE_W/2)*fit*k;
 panY=-(a[1]-BASE_H/2)*fit*k;
 paint();
}
function diagnostics(){return{canonical:CATALOG.length,matched:geomById.size,missing:missing.map(c=>c.id),geographicShapes:shapes.length,selected,zoom:k};}
function renderDiagnostics(){const d=diagnostics();$('debugInner').textContent=`دول اللعبة: ${d.canonical}\nمطابقة حدود الدول: ${d.matched}\nدول ناقصة: ${d.missing.length}\nالأشكال الجغرافية: ${d.geographicShapes}\nالدولة المختارة: ${selected||'—'}\nالتكبير: ${k.toFixed(2)}×\nالمصدر: Natural Earth 10m، بدون إنترنت`;}
function selectCountry(id,{focus:shouldFocus=false}={}){
 const c=byId.get(id),geometry=geomById.get(id);if(!c||!geometry)return false;
 // Draw a real SVG path copied from the country, never a bounding rectangle.
 selected=id;
 for(const el of playable)el.classList.toggle('is-selected',el===geometry);
 outline.setAttribute('d',geometry.getAttribute('d'));
 outline.style.display='block';
 $('countryName').textContent=c.name;
 $('countryDesc').textContent='تحديد جغرافي مطابق لحدود الدولة، مرتبط بمعرّف اللعبة الحقيقي.';
 $('selectedIso').textContent=c.iso;$('selectedId').textContent=c.id;
 if(shouldFocus)focus(id);
 renderDiagnostics();
 const detail={gameCountryId:c.id,isoAlpha3:c.iso,name:c.name};
 if(typeof window.onCountrySelected==='function')try{window.onCountrySelected(detail);}catch(error){console.error('country callback error',error);}
 window.dispatchEvent(new CustomEvent('country-selected',{detail}));
 return true;
}
/* A deliberate tap on the open sea clears the country highlight without changing zoom or pan. */
function clearSelection(){
 if(selected===null)return false;
 selected=null;
 for(const el of playable)el.classList.remove('is-selected');
 outline.setAttribute('d','');
 outline.style.display='none';
 $('countryName').textContent='اختر دولة من الخريطة';
 $('countryDesc').textContent='اضغط على أي دولة ملوّنة، أو ابحث عنها بالاسم. حرّك الخريطة واسحبها للتنقل.';
 $('selectedIso').textContent='—';
 $('selectedId').textContent='—';

 renderDiagnostics();
 window.dispatchEvent(new CustomEvent('country-selection-cleared',{detail:{gameCountryId:null}}));
 return true;
}

/* Mouse drag via pointer events. Touch is handled separately to prevent iOS page zoom/navigation gestures. */
let mouse=null;
function getHit(target){const t=target?.closest?.('[data-country-id]');return t?.dataset.countryId||null;}
/* Land without a game ID is not sea, so clicking an unplayable country won't clear selection. */
function isSeaTarget(target){return !!target&&!target.closest?.('.land, [data-country-id]');}
svg.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch'||e.button!==0)return;
 const p=pos(e);mouse={id:e.pointerId,last:p,start:p,hit:getHit(e.target),sea:isSeaTarget(e.target),moved:false};
 try{svg.setPointerCapture(e.pointerId);}catch(_){}
 svg.classList.add('dragging');tip.style.display='none';
});
svg.addEventListener('pointermove',e=>{
 const p=pos(e);
 if(mouse&&mouse.id===e.pointerId){
   const dx=p.x-mouse.last.x,dy=p.y-mouse.last.y;
   if(Math.hypot(p.x-mouse.start.x,p.y-mouse.start.y)>6)mouse.moved=true;
   panX+=dx;panY+=dy;mouse.last=p;paint();return;
 }
 if(e.pointerType!=='mouse')return;
 const id=getHit(e.target);
 const label=id?byId.get(id)?.name:e.target.closest('path[data-name]')?.dataset.name;
 if(!label){tip.style.display='none';return;}
 tip.textContent=label;tip.style.display='block';
 tip.style.left=clamp(e.clientX+13,8,innerWidth-tip.offsetWidth-8)+'px';
 tip.style.top=clamp(e.clientY+15,75,innerHeight-tip.offsetHeight-8)+'px';
});
function mouseRelease(e){
 if(!mouse||e.pointerId!==mouse.id)return;
 const m=mouse;mouse=null;svg.classList.remove('dragging');
 if(!m.moved&&Math.hypot(pos(e).x-m.start.x,pos(e).y-m.start.y)<8){
   if(m.hit)selectCountry(m.hit);
   else if(m.sea)clearSelection();
 }
 try{svg.releasePointerCapture(e.pointerId);}catch(_){}
}
svg.addEventListener('pointerup',mouseRelease);
svg.addEventListener('pointercancel',()=>{mouse=null;svg.classList.remove('dragging');});
svg.addEventListener('lostpointercapture',()=>{mouse=null;svg.classList.remove('dragging');});

/* Native touch events with non-passive preventDefault: iOS Safari/WebView must not interpret map pinch as page zoom. */
let touch=null;
const midpoint=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))});
const locations=e=>Array.from(e.touches).map(t=>pos(t));
svg.addEventListener('touchstart',e=>{
 if(e.cancelable)e.preventDefault();
 const pts=locations(e);
 if(!pts.length)return;
 if(pts.length===1){
   if(!touch||touch.mode!=='single')touch={mode:'single',start:pts[0],last:pts[0],hit:getHit(e.target),sea:isSeaTarget(e.target),moved:false};
 }else{
   touch={mode:'pinch',prev:midpoint(pts[0],pts[1]),moved:true};
 }
 tip.style.display='none';svg.classList.add('dragging');
},{passive:false});
svg.addEventListener('touchmove',e=>{
 if(e.cancelable)e.preventDefault();
 if(!touch)return;
 const pts=locations(e);
 if(pts.length>=2){
   const p=midpoint(pts[0],pts[1]);
   if(touch.mode==='pinch'){
     panX+=p.x-touch.prev.x;panY+=p.y-touch.prev.y;
     zoomAt(k*p.d/touch.prev.d,p.x,p.y);
   }
   touch={mode:'pinch',prev:p,moved:true};
 }else if(pts.length===1&&touch.mode==='single'){
   const p=pts[0],deltaX=p.x-touch.last.x,deltaY=p.y-touch.last.y;
   if(Math.hypot(p.x-touch.start.x,p.y-touch.start.y)>8)touch.moved=true;
   panX+=deltaX;panY+=deltaY;touch.last=p;paint();
 }
},{passive:false});
svg.addEventListener('touchend',e=>{
 if(e.cancelable)e.preventDefault();
 if(!touch)return;
 const n=e.touches.length;
 if(n===0){
   const t=touch;touch=null;svg.classList.remove('dragging');
   if(t.mode==='single'&&!t.moved){
     if(t.hit)selectCountry(t.hit);
     else if(t.sea)clearSelection();
   }
 }else if(n===1){
   // Never turn the remaining finger of a pinch into an accidental country tap.
   touch={mode:'single',start:locations(e)[0],last:locations(e)[0],hit:null,moved:true};
 }
},{passive:false});
svg.addEventListener('touchcancel',()=>{touch=null;svg.classList.remove('dragging');},{passive:false});
// Additional iOS native gesture fallback; applies only if gesture begins on the map itself.
for(const kind of ['gesturestart','gesturechange','gestureend']){
 document.addEventListener(kind,e=>{if(svg.contains(e.target)&&e.cancelable)e.preventDefault();},{passive:false});
}
svg.addEventListener('wheel',e=>{
 e.preventDefault();const p=pos(e);
 const dy=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?h:1);
 zoomAt(k*Math.exp(-clamp(dy,-250,250)*.002),p.x,p.y);
},{passive:false});
svg.addEventListener('dblclick',e=>{e.preventDefault();const p=pos(e);zoomAt(k*1.6,p.x,p.y);});
svg.addEventListener('keydown',e=>{
 if(getHit(e.target)&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectCountry(getHit(e.target));}
 if(e.target===svg){if(e.key==='+')zoomAt(k*1.6);if(e.key==='-')zoomAt(k/1.6);}
});

/* Search uses the 130 exact country IDs and never invents game statistics. */
const arabicAliases={
 'united-arab-emirates':'الإمارات الامارات', 'saudi-arabia':'السعودية',
 'united-states':'أمريكا الولايات المتحدة',canada:'كندا',brazil:'البرازيل',
 'united-kingdom':'بريطانيا المملكة المتحدة',germany:'ألمانيا',
 'russia':'روسيا',india:'الهند',japan:'اليابان',
};
let shown=[];
function suggestions(){
 const term=search.value.toLocaleLowerCase().trim();
 if(!term){shown=[];matches.style.display='none';return;}
 shown=CATALOG.filter(c=>c.id.includes(term)||c.name.toLocaleLowerCase().includes(term)||c.iso.toLowerCase().includes(term)||(arabicAliases[c.id]||'').includes(term)).slice(0,8);
 matches.replaceChildren();
 for(const c of shown){const btn=document.createElement('button');btn.type='button';btn.textContent=c.name+' · '+c.iso;btn.addEventListener('click',()=>{selectCountry(c.id,{focus:true});search.value='';matches.style.display='none';search.blur();});matches.appendChild(btn);}
 matches.style.display=shown.length?'block':'none';
}
search.addEventListener('input',suggestions);
search.addEventListener('keydown',e=>{
 if(e.key==='Escape'){matches.style.display='none';search.blur();}
 else if(e.key==='Enter'&&shown.length){selectCountry(shown[0].id,{focus:true});search.value='';matches.style.display='none';search.blur();}
});
document.addEventListener('pointerdown',e=>{if(!search.contains(e.target)&&!matches.contains(e.target))matches.style.display='none';});
</script></main></body></html>
